# Base pipeline config. Every key a profile or --set may override MUST exist here (typos fail loudly).
# Resolution order: default.yaml < profiles/<profile>.yaml < --config <file> < --set key=value
# The fully resolved config is written next to every output (out/<capture>/config.resolved.yaml).

runtime:
  device: auto              # auto | cpu | mps | cuda
  dtype: float32            # float32 | float16 | bfloat16 (half precision only on cuda)
  num_threads: 0            # 0 = library default
  gpu_memory_fraction: 0.0  # cap on Apple-GPU (MPS) memory as a share of RAM; 0 = no cap. MPS memory is shared
                            # with macOS and invisible to process RSS, so an uncapped run can freeze the machine.
  seed: 0
  cache_dir: cache
  weights_dir: weights

lidar:
  frame_stride: 3           # use every k-th frame for fusion
  min_confidence: 2         # ARKit confidence 0/1/2
  max_depth_m: 5.0
  voxel_m: 0.02             # point-cloud voxel size after fusion

geometry:
  wall_band_m: [0.5, 2.0]   # height band above floor used to extract walls
  ransac_threshold_m: 0.01
  manhattan_snap_deg: 5.0   # snap walls to dominant axes within this angle; 0 disables
  min_wall_len_m: 0.3

openings:
  min_width_m: 0.5
  max_width_m: 2.5
  rgb_edge_refine: true     # refine opening edges on full-res RGB (needed for the 2 cm gate)

recon:                      # learned geometry for the photo and video tiers (see roomscan/models.py)
  model: da3-base           # multi-view depth + pose
  metric_model: da3metric-large   # metric scale anchor
  max_views: 8              # views per forward pass (memory-bound)
  image_long_side: 504      # px, multiple of 14
  video_keyframes: 60       # keyframes sampled from a walkthrough clip
  window_overlap: 2         # shared views between consecutive windows
  photo_stitch: true        # link photo rooms through photos that see into each other (E14, roomscan/stitch)
  photo_outline: walls      # walls (flood inside observed walls) | box (outermost long wall lines, E13)
  video_join_pieces: true   # fix loop: join COLMAP pieces through fast turns (false = largest piece only)
  video_fps: 8.0            # frames per second sampled for camera tracking (COLMAP)
  video_matcher: sequential # sequential | exhaustive (all pairs: finds revisits, slower)
  video_seq_overlap: 10     # sequential matching: each frame is matched with this many following frames

drift:
  method: posegraph         # off | posegraph   ("off" is for the ablation only)

damage:
  backend: vlm              # vlm | off
  vlm_model: claude-opus-5-5
  keyframes_per_room: 10
  cache: replay_or_live     # replay (fail on miss) | live | replay_or_live

calib:
  coverage: 0.9             # nominal interval coverage

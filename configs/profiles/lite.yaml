# Floor profile: any machine with <16 GB RAM or no usable GPU (e.g. M1 8 GB). Must always run.
description: "<=8-16 GB RAM, CPU or small Apple GPU"
recon:
  model: da3-base
  metric_model: da3metric-large
  max_views: 4             # E1: Base peaks 2.4 GB @4 views, 7.3 GB @8 (T4) -> 4 on an 8 GB laptop
  image_long_side: 504
  video_keyframes: 40
lidar:
  frame_stride: 4

[project]
name = "roomscan"
version = "0.3.1"
description = "Handheld phone capture (photos / video / LiDAR) -> dimensioned, stitched floor plans with damage, scope and calibrated intervals"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "pillow-heif>=0.16",   # iPhone stills default to HEIC
    "shapely>=2.0",
    "matplotlib>=3.8",
    "jsonschema>=4.21",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
# Dense fusion / ICP / pose graph for the LiDAR tier and drift correction.
geo = ["open3d==0.19.0"]  # 0.20 macOS wheel dlopens Homebrew libusb; 0.19 is self-contained
# Learned geometry for the photo and video tiers (Depth Anything 3 is installed from git by scripts/setup_models.sh).
ml = ["torch>=2.3", "torchvision>=0.18", "huggingface_hub>=0.23"]
# Damage detection with a VLM. Responses are cached under cache/ so benchmark runs replay deterministically.
vlm = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
roomscan = "roomscan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.hatch.build.targets.wheel]
packages = ["roomscan"]

[tool.hatch.build.targets.wheel.force-include]
# ship configs + schema inside the wheel so a regular (non-editable) install works
"configs" = "roomscan/_data/configs"
"schema" = "roomscan/_data/schema"

# Tape ground truth for YOUR space (photo + video tiers). Fill in centimetres; two readings each.
# How to measure: see "Measuring" in the chat / docs/CAPTURE_PROTOCOL.md. Leave a value as null if you could not
# measure it; never estimate.
space_id: home_tape
measured_on: 2026-10-02
instrument: tape
instrument_model: ""          # e.g. "Stanley 5 m"
phone: "iPhone 14 Plus"       # e.g. "iPhone 15" (Settings > General > About > Model Name)

rooms:
  - id: study                 # rename freely (bedroom, kitchen...), must match the photo folder name
    ceiling_height_cm: [274.3, null]    # 108 in
    # Four readings taken before the wall order was recorded: 138, 130, 123, 123 in = 350.5, 330.2, 312.4, 312.4 cm.
    # 138 vs 130 on opposite walls is explained by a cove near the second doorway. Still to record: the clockwise
    # order from the first doorway, the cove's width and depth, both door widths, and second readings.
    unassigned_wall_readings_cm: [350.5, 330.2, 312.4, 312.4]
    walls:                              # clockwise, starting with the wall that has the door; label them w1, w2...
      - {id: w1, length_cm: [null, null]}
      - {id: w2, length_cm: [null, null]}
      - {id: w3, length_cm: [null, null]}
      - {id: w4, length_cm: [null, null]}
    openings:                           # inside the frame, jamb to jamb (doors) / reveal to reveal (windows)
      - {id: d1, wall: w1, type: door, width_cm: [null, null], height_cm: [null], connects_to: null}
      - {id: d2, wall: null, type: door, width_cm: [null, null], height_cm: [null], connects_to: null}
  # Not measured (owner: not feasible). Kept so the stitch can be scored for adjacency and overlaps only.
  - id: bedroom
    ceiling_height_cm: [null, null]
    walls: []
    openings: []
  - id: living                          # "dining and sofa hall"
    ceiling_height_cm: [null, null]
    walls: []
    openings: []
  - id: kitchen
    ceiling_height_cm: [null, null]
    walls: []
    openings: []

adjacency:                              # owner-confirmed 2026-10-02: every room opens onto the living/dining hall
  - [study, living]
  - [bedroom, living]
  - [kitchen, living]

damage:                                 # staged damage in ONE room, two different kinds; not staged yet
  - {room: null, wall: null, class: water_stain, width_cm: null, height_cm: null, height_above_floor_cm: null}
  - {room: null, wall: null, class: crack, width_cm: null, height_cm: null, height_above_floor_cm: null}

captures:                               # filled in by you / by me as files arrive
  - {path: data/raw/photos/study_src, tier: photos, rooms: [study], note: "13 stills, mixed lens/orientation; variants in bench/datasets/study_photo_variants.yaml"}
  - {path: data/raw/video/study_walk1.MOV, tier: video, rooms: [study]}
  - {path: data/raw/photos/house_batch2_src, tier: photos, rooms: [bedroom, living, kitchen], note: "4622-4628 bedroom, 4629-4634 + 4636 living, 4635 kitchen (single photo: below the 2-photo minimum)"}
  - {path: data/raw/photos/house_a, tier: photos, rooms: [study, bedroom, living]}
  - {path: data/raw/photos/house_a_portrait, tier: photos, rooms: [study, bedroom, living], note: "house_a minus 4628 (the one landscape photo) to avoid the E8 orientation crash"}
  - {path: data/raw/video/house_IMG_4637.MOV, tier: video, rooms: null, note: "50 s walk through several rooms (owner); exact rooms and start/end point not stated"}
